		#autoLOC_316245 = Var olan düğümler kaldırılır, ardından mevcut Mun yörüngesinde yeni bir düğüm oluşturulur. Yeri önemli değil; yakmanın sonuçlarını eve dönüş yönünde görselleştirmek için düğüm zaten taşınacak.\n\nMun'un Etki Alanından çıkan bir yörünge izi elde edilene kadar (yani kaçış yörüngesi elde edilene kadar) prograde tutamacı sürüklenir. Ardından düğümün kendisi sürüklenirken Kerbin periapsisinin nasıl değiştiği izlenir. En düşük Pe değeri, ayrılma vektörü Mun'un yörünge izine paralel ama ters yönde olduğunda elde edilir. (Kerbin Pe'si Kerbin'in yüzeyinin altına inerse, Pe tekrar görünür olana kadar retrograde tutamacı sürüklenerek yakma azaltılır. Bu, atmosfere girişin güvenle atlatılmasını sağlar.)\n\nBöylece, munar yörüngede prograde olmasına rağmen nihai Kerbin yörüngesinde retrograde bir etki yaratan bir ayrılma manevrası oluşturulmuş olur! Aynı ilke Kerbin'den diğer gezegenlere gitmek için de kullanılabilir, ancak orada gezegenler arası en verimli seyahat zamanlarını ifade eden \"geçiş pencerelerine\" dikkat etmek gerekir.\n\nKerbin periapsisi 5km ile 32km arasına ayarlandıktan sonra devam etmek için ileri tıklanır. (Manevraya radial-in veya radial-out delta-v ekleyerek ince ayar yapmak ya da düğümü hafifçe kaydırmak gerekebilir.)
