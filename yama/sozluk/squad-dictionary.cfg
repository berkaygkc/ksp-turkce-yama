		#autoLOC_316420 = Bu kez kapsülde bir ısı kalkanı bulunduğuna dikkat: kalkansız transmunar bir atmosfere girişten sağ çıkmak zar zor mümkün olsa da, bu gerçekten çok tehlikelidir. Mun'dan daha uzak bir yerden doğrudan dönülmeye kalkışılırsa, kalkan olmadan kavrulmuş bir közden farkı kalmaz! \n\nAşırı atmosfere giriş ısısından kaçınmanın bir başka yolu, bir bekleme yörüngesine girip ve/veya bir frenleme yakması yaparak daha yumuşak ve yavaş bir atmosfere giriş gerçekleştirmektir. Ne var ki bu, epey ekstra yakıt gerektirir\u2014 ve açıkçası çok daha az eğlencelidir.\n\nIsı kalkanının eklediği kütle nedeniyle (ama kapsüle tam oturduğu için telafi edecek ekstra sürüklenme yoktur), bu araç kapsülün tek başına yapabileceği kadar iyi yavaşlayamaz. Bu yüzden aracın üstündeki ana paraşütün yanı sıra yan tarafa monte edilmiş bir drog paraşüt de bulunuyor. Drog paraşüt simgesi 'güvenli' gösterdiğinde (kırmızı veya turuncu arka plan yoksa), açmak için aşamalanabilir.\n\nDrog paraşütler daha zayıf frenleme araçlarıdır, ama normal paraşütlerin çalışamayacağı daha yüksek hız ve rakımlarda işe yararlar; böylece araç, daha güçlü normal paraşütlerin güvenle kullanılabileceği bir noktaya kadar yavaşlatılır. Drog paraşüt üzerine düşeni yaptığında devam ederiz.
