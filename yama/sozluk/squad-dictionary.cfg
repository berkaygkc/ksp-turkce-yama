		#autoLOC_316218 = Bir uydudan, çevresinde döndüğü gök cismine dönebilmek için (ya da bir gezegenden ayrılıp güneş yörüngesine geçmek için) kaçış hızına ulaşılması gerekir; bunun yörüngenin hangi noktasında yapıldığı da büyük önem taşır. Kaçış hızına ulaşmak için harcanan çabanın doğru sonuç yörüngesini oluşturduğundan emin olunmalı.\n \nHenüz orada değilse harita görünümüne geçilir (<color=<<1>>>[<<2>>]</color> tuşu). Kamera, üç cismi de\u2014araç, Mun ve Kerbin\u2014yukarıdan gösterecek şekilde yeterince uzaklaştırılıp döndürülür. Yörüngedeki hareket yönüne dikkat edilmeli: yukarıdan bakıldığında yörünge saat yönünün tersine ilerliyor. Ardından, Mun'un Kerbin çevresindeki yörüngesindeki hareket yönü kontrol edilir. Mun de aynı yönde dönüyor: ana gök cisminin dönüşüyle uyumlu, yani \"prograde\" bir yörünge. \n\nMun'un hareket yönünün tersine doğru bir ayrılma yapacağız, ama bunu yapmak için Mun etrafındaki kendi yörüngemize göre ileri yönde hızlanacağız. Şimdi bunun nasıl yapıldığına bakalım.
