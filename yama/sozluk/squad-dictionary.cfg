		#autoLOC_8003363 = Kerbal Space Program 1.9'da yenilikler: Ev gibisi yok!\n\nEn son sürümümüz Kerbal Space Program deneyimini geliştirmeye devam ediyor ve bunu oyunculara sunmaktan mutluluk duyuyoruz. Eklediğimiz özelliklerin çoğu doğrudan kullanıcı geri bildirimlerinden geliyor; ayrıca bu sürüm hata düzeltmelerine ve performans iyileştirmelerine de odaklanıyor. \n\nEn büyük değişiklik, geliştirilmiş dokular ve gölgelendiricilerle Kerbin'in kendisinde yapılan büyük bir iyileştirme. Kerbin hiç bu kadar iyi görünmemişti! Ayrıca Skipper, Mainsail ve Thumper motorlarını da yeniledik.\n\nDiğer yeni özellikler arasında, duraklatıldığında herhangi bir açıdan ekran görüntüsü almayı kolaylaştıran bir kamera modu, parçalardan kaynak boşaltmak için kullanılabilecek yeni bir tahliye valfi parçası ve Breaking Ground kullanıcıları için helikopter ve diğer döner kanatlı araçların yapımını ve kontrolünü kolaylaştıran, kanat parçalarına eklenen döngüsel ve kolektif sapma kontrolleri yer alıyor.\n\n1.9 sürümü ayrıca kullanıcı geri bildirimlerinden yararlanılarak eklenen çeşitli yaşam kalitesi iyileştirmeleri de içeriyor. En sevdiklerimizden biri, gezegenin belirli rakımlarının üzerinde hızlandırmayı kısıtlayan sınırlamaların kaldırılması için zaman hızlandırma sisteminde yapılan ayar. Bir diğeri ise aracı herhangi bir gök cisminin atmosferinde ya da yüzeyinde inmiş halde konumlandırmayı sağlayan yeni bir hile.\n\nAyrıca iki büyük performans iyileştirmesi daha ekledik. Tek kamera sistemiyle DX11 render performansı artıyor ve KSPedia'nın dinamik olarak yüklenmesiyle bellek kullanımı azalıyor.\n\nKerbal Space Program'ın en son sürümünün keyfini çıkar!\n
