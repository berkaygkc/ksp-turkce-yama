		#autoLOC_316362 = Tebrikler! Eve dönüş yolunda ilerleniyor.\n \nKerbin'e yaklaşana kadar zamanı hızlandıralım. Periapsisten en az bir Kerbin yarıçapı uzaklıkta ama yakın bir noktada yörünge üzerine <color=<<1>>>tıklanıp</color> <color=<<2>>>Buraya Hızlandır</color> seçilir. Bunun yerine <color=<<3>>>[<<4>>]</color> tuşuna basarak zaman hızlandırma kontrolleri de kullanılabilir, ama yaklaşırken hızlandırmanın azaltılması unutulmamalı; Kerbin'in yerçekimi yaklaşırken hızı epey artırır!\n \nRakım 120km'nin altına indiğinde devam ederiz. Otomatik hızlandırma kullanıldıysa, son mesafeyi kapatmak için otomatik hızlandırma bittikten sonra zamanı elle 5x veya 10x'e çıkarmak yararlı olabilir (otomatik hızlandırmanın 120km rakımdan çok önce bittiği varsayılarak).
