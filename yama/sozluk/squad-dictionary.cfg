		#autoLOC_6005140 = Kerbal Space Program 1.12: Son Yaklaşma'da yeni neler var\n\nKerbal Space Program'ın 10. yıl dönümü güncellemesini sunmaktan büyük heyecan duyuyoruz. Bu sefer her zamankinden daha fazla içerik ekliyoruz ve KSP'nin yıl dönümünü, doldurduğumuz tüm yeni özellikler ve içeriklerle görkemli bir şekilde kutlayacağız. Öyleyse hemen başlayalım!\n\nİlk olarak, iki büyük yeni uygulama kullanıma sunuldu. Yeni Manevra Oluşturucu uygulaması, diğer gök cisimlerine hızlıca geçiş oluşturmayı, yaklaşan geçiş pencerelerini görmeyi ve nereye gidildiğini, oraya varmak için ne kadar deltaV gerektiğini net biçimde anlamayı sağlıyor. \n\nBununla birlikte, Alarm Saati uygulaması da ekleniyor. Geçişler dahil her manevra için alarm kurulabildiği gibi, elle zaman alarmları ve çeşitli yörünge konumları için alarmlar da oluşturulabiliyor. Hiçbir şeyi kaçırmamak için alarmlara eğlenceli bir alarm sesi seçmek de unutulmamalı!\n\nSırada, yaklaşan 10. yılımız için bir yığın içerik ekliyoruz. Bunlar arasında: \n- Güneş sistemine dağılmış yeni paskalya yumurtaları.\n- Ziyaret ederek açılabilecek, Kerbin üzerinde yeni fırlatma alanları.\n- Yeni bir 'İnce' kıyafet.\n- Kutlamalara eşlik edecek yeni havai fişek fırlatıcıları!\n\nBunun yanında, KSP kullanıcı deneyimini iyileştirecek, çokça talep edilen birçok yeni özellik ve yaşam kalitesi eklentisi de var. Bu kapsamda eklenenler:\n- Araç ve oyun kayıtlarının yüklenmesinde büyük bir yenileme; arama, klasörleme ve araç dosyalarına kayıtlar arası erişim ekleniyor. \n- Kenetlenme portlarına eklenen döner yakalar sayesinde bağlı araçlar artık kusursuzca hizalanabiliyor.\n- Bayrak panellerimizin yapısal varyantları.\n- İstek üzerine ayrılan destek çubukları.\n- Parça araçlarının güncellenmesi ve birçok mod geliştiricisi talebinin uygulanması.\n- Çok sayıda tekerlek ve iniş ayağı düzeltmesi ve iyileştirmesi.\n- Ve daha fazlası...\n\n1.12'de ayrıca yeni parçalar ve yenilemeler de geliyor. Pol ve Eeloo, tüm güneş sisteminin görsel yükseltmesini tamamlayan güzelleştirme işleminden geçti. Tüm kenetlenme portları yenilendi. Ayrıca 1,25 metrelik bir motor plakası ve bir dizi yeni güneş paneli de ekleniyor.\n\nElbette burada sıralanamayacak kadar çok hata düzeltmesi ve diğer iyileştirme var, en ince ayrıntısına kadar hepsi değişiklik günlüğünde bulunabilir.\n\nBunun bugüne kadarki en iyi güncellemelerimizden biri olduğu konusunda hemfikir olunacağını umuyoruz! Ne yazık ki güzel şeylerin bir sonu var. Son Yaklaşma, Kerbal Space Program için planlanan son büyük sürüm. Bu inanılmaz oyun üzerinde sizin için çalışmak tam anlamıyla bir onur ve keyifti. Burada herkes için bu bir sevgi emeği oldu ve her adımda böylesine harika bir toplulukla birlikte olmaktan büyük bir ayrıcalık duyduk. Bu yolculuğa katıldığınız için teşekkür ederiz. \n\nYine de Squad hiçbir yere gitmiyor. Sosyal medya ekibimiz etkinlikler düzenlemeye devam edecek ve KSP2'ye yardım etmekle meşgulken KSP'nin ve topluluğun uzun yıllar yaşamaya devam edeceğini umuyoruz.\n\nKerbal Space Program 1.12: Son Yaklaşma'nın tadını çıkarın ve umarız 2022'de Kerbal Space Program 2 ile yeni maceralarda bize katılırsınız!
