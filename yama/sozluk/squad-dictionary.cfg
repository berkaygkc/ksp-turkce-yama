		#autoLOC_316043 = Tamam, devam edelim. Bu dönüş uçuşunun üç farklı aşaması olacak: Mun yüzeyinden kalkış, Kerbin'e geçiş enjeksiyonu ve transmunar atmosfere giriş. İlk aşamayı, yani alçak munar yörüngenizi kurmayı bitirdiğinizde, bir sonrakinin ayrıntılarını ele alacağız.\n \nŞimdilik, yapacağınız şey şu (bu derslerde her zaman olduğu gibi, direksiyonunuza yardımcı olması için bir hedef işareti ekleyeceğim):\n\t* Gazı artırın, sonra hemen işareti takip ederek 90 derecelik rota çizgisine (yani doğuya) doğru yunuslama yapın.\n\t* Apoapsisiniz 50km'nin üzerine çıktığında gazı kesin.\n\t* Apoapsiste daireselleştirin.\n \nBu, Yörüngeye Git dersinde Kerbin çıkışınızı yaparken olduğundan çok daha basit olacak. Mun'un yerçekimi kuyusu Kerbin'inkinden çok daha sığ, o yüzden tek bir aşama bile yeterli\u2014 hatta onun tamamı bile gerekmiyor. Unutmayın, bu Mun'a inmek için kullandığınız aynı aşama, onu eve dönmek için de kullanacağız. Mun'un yerçekimi Kerbin'inkinden o kadar zayıf, üstelik bir atmosfer tarafından da geride tutulmadığımız için, bu tek aşama görevin tüm iniş-ve-dönüş bacağı için yeterli yakıt kapasitesine sahip olacak.
