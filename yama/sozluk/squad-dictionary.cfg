		#autoLOC_317954 = Güzel! Yörünge eğimi işte böyle değiştirilir.\n\nBu tür manevralar için, yörüngeyi çevirmek üzere daha az delta-v harcamak adına bunu her zaman yörüngenin en yavaş kısımlarında yapmak daha iyidir. Bu da, şu an olduğu gibi daha büyük yörüngelerdeki eğim değişikliklerinin, daha alçak bir yörüngedeki aynı eğim değişikliğinden daha az yakıt gerektirdiği anlamına gelir.\n\nAyrıca, eğimi değiştirmenin mutlaka kuzeye veya güneye hızlanmak anlamına gelmediği unutulmamalı. Bu, prograde vektörüne dik açıyla hızlanmak anlamına gelir; bu da neredeyse ekvatoral olan bu yörüngede kuzey yönüne denk gelmiştir.\n\nSırada, öğrenilmesi gereken son temel manevraya bakılacak: yörüngeyi alçaltmak.
