		#autoLOC_6002522 = Kerbal Space Program 1.10: Paylaşılan Ufuklar'da yeni neler var\n\nKerbal Space Program'ın 1.10 güncellemesine hoş geldiniz! Bu özel bir güncelleme, çünkü size harika yeni içerikler ve KSP güneş sistemine büyük bir katkı sunmak için Avrupa Uzay Ajansı ile birlikte çalıştık.\n\nÖncelikle, ESA ile iş birliğimiz, gerçek dünyadaki BepiColombo ve Rosetta görevlerinin KSP sürümlerini oyuna getiriyor. Üstelik bunları Making History DLC'si olmadan da oynayabilirsiniz!\n\nUzay trivia'sına hakimseniz, Rosetta görevinin eklenmesiyle oyuna kuyruklu yıldızları eklemek zorunda olduğumuzu bilirsiniz! Bunlar tüm oyun modlarında karşınıza çıkacak ve kariyer modunda birkaç yeni kuyruklu yıldız temalı kontrat bulunacak. Kuyruklu yıldızların gerçekçi, değişken kuyrukları var ve standart asteroitlerden belirgin şekilde daha büyükler. Hatta yıldızlar arası uzaydan bize misafirliğe gelen birini bile görebilirsiniz!\n\nOyuna birçok yeni parça ekledik ve bazılarını güncelledik. İlk olarak, çok görevli veya çok ajanslı araçlarınızı çeşitli bayraklarla süsleyebilmeniz için bir dizi yeni bayrak parçası ekledik. İkinci olarak, Pençe'nin daha küçük bir sürümünü ve yeni bir bilim deneyi olan manyetometreyi ekledik. Ayrıca bazı tanklarda, SRB'lerde ve ayırıcılarda yeni varyantlar var; kaplamalarda ise yalnızca yeni varyantlar değil, bazı güncellenmiş işlevler de bulunuyor - bir göz atın!\n\nBazılarınızın Nisan Jool Şakası yazımızdan fark ettiği gibi, Jool bir yenileme geçirdi - ama yeşil kalmaya devam etti. Daha da iyisi, Jool'un bulutları artık animasyonlu. Bir kesişmeye zaman hızlandırırken izlemesi gerçekten şaşırtıcı. Laythe de bir yenileme aldı, böylece Jool'u hayranlıkla izlemek için güzel bir sahil sandalyesi kurabileceğiniz bir yer var artık.\n\nSırada, farklı takım elbise türlerini ve renklerini seçmenizi sağlayan yeni bir EVA takım seçici var; bu sayede Kerbal'inizin son derece koruyucu kıyafetini kişiselleştirebilirsiniz - yeni bir ESA takım dokusu seçeneği de dahil! Ayrıca mod geliştiricilerinin kendi takım dokularını oyuna eklemesi artık çok daha kolay.\n\nSon olarak, değişiklik günlüğümüzde inceleyebileceğiniz bir dizi hata düzeltmesi, performans güncellemesi ve yaşam kalitesi iyileştirmesi de bulunuyor. Kerbal Space Program 1.10: Paylaşılan Ufuklar'ı beğeneceğinizi umuyoruz.
