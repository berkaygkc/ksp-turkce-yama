		#autoLOC_900077 = Bu ay tespit edilmesi özellikle zordu, çünkü tam bir polen tanesi gibi görünüyordu, hele tozlu tarlaların yakınındaki teleskoplardan bakıldığında.\n\nPol sonunda, o lekeden bir türlü kurtulamayan biri, bir kez daha başarısız bir denemeden sonra pes edip polenin konumunu not almaya karar verince keşfedildi.
		#autoLOC_900080 = Tylo, Kerbal Astronomi Derneği tarafından keşfedilen Jool'un ilk ayıydı. Ofis duvarlarına asmak için kusursuz bir Jool fotoğrafı çekme yönündeki pek çok başarısız denemenin ardından, gökyüzünde gezinen o beyaz lekenin aslında bir ay olduğu sonunda anlaşıldı.\n\nBilim insanları, yüzeyinden bakıldığında tepede Laythe, Vall ve Jool'u birden görmenin "gerçekten bir şey" olması gerektiğini öne sürüyor.
		#autoLOC_900082 = Vall, Jool'un keşfedilen son aylarından biriydi. Sinirlenen bilim insanları onu teleskoplarının merceklerinden silmeye çalışıp durdu. Sonunda art arda gelen teleskop iadelerinin ardından Advanced Optics Co., onlara bunun gökyüzünde gerçek bir cisim olduğunu söylemeye karar verdi.
		#autoLOC_900084 = Laythe ilk keşfedildiğinde kayıtlara geçirilmedi, çünkü sorumlu bilim insanı Kerbin'e baktığını sanıyordu.\n\nNeyse ki bu hata, gözü pek bir stajyerin ona "teleskoplar öyle çalışmaz" diye bilgi vermesiyle düzeltildi.\n\nStajyer kısa süre sonra "terfi ettirilip" deneysel roket test programına aktarıldı.
		#autoLOC_900086 = Ike, zaman zaman Duna'nın yörüngesinde dönerken görülen, nispeten büyük, gri bir cisimdir. Bilim insanları, Ike'ın sanki ana gezegeninin yakınından geçmeye cüret eden her cismin işine sinsice karışacak şekilde mükemmel bir konumda durduğunu öne sürüyor.
		#autoLOC_900088 = Minmus, Kerbin'in yörüngesindeki en küçük aydır. Kerbin yüzeyinden, açık günlerde gökyüzünde minicik mavi bir nokta olarak görülebilir. \n\nSık sık teleskop merceğindeki kir ya da ölü piksel sanılır, ama Kerbal Astronomi Derneği'ndeki en parlak zihinler bunun yine de gerçek bir ay olduğuna dair bizi temin ediyor.
		#autoLOC_900090 = Mun, Kerbin'in yörüngesinde dönen büyük bir uydudur. Görünüşü çoğunlukla gridir; aksi takdirde pürüzsüz olan yüzeyini çeşitli boyutlarda kraterler noktalar.\n\nMun'un keşfi, Kerbal evriminin önemli atılımlarından biri olarak yaygın şekilde kabul edilir. Doğrusu, çok da uzun zaman önce olmadı, ama yine de Kerballar o zamana kıyasla şimdi daha bilge ve daha evrimleşmiş, demek yanlış olmaz.
		#autoLOC_900092 = Gilly, Eve'in yörüngesinde dolaşan yumru yumru bir kayadır. Kerbal Astronomi Derneği'nin keşfettiği açık ara en küçük doğal uydudur.\n\nKeşfiyle birlikte gelen yoğun gözünü kısma ve göz yorgunluğu yüzünden, gözlük takmak artık başarılı bir Gökbilimci olmanın simgesi haline gelmiştir.
		#autoLOC_900094 = Eeloo'nun gerçek bir gezegen mi yoksa sadece "Güneş'in etrafında dönen bir buz yumrusu" mu olduğu konusunda hatırı sayılır bir tartışma sürüyor. Bu konuyu ele almak için düzenlenen akademik zirvelerin çoğu, iyi günlerde ufak tefek laf sokuşturmalara, kötü günlerde ise tam anlamıyla kavgalara dönüştüğü için tartışma hâlâ devam ediyor.
		#autoLOC_900096 = Jool, özellikle oldukça büyük, ağırlıklı olarak yeşil bir gezegen olmasıyla tanınır. Kerbal türü, gökyüzünde ilk fark edildiği andan beri onu ziyaret etmeyi arzuluyor. Filozoflar, o girdaplı yeşil gezegenin, sağlıklı görünen renginden dolayı ziyaret edilecek gerçekten güzel bir yer olması gerektiğini savunuyor.\n\nJool'a bir teleskopla bakarsanız bulanık görünür.
		#autoLOC_900098 = Dres çok küçük bir gezegendir. Cüce olarak kabul edilen ilk gezegendi. Yörüngesi son derece düzensizdir ve boyutuyla birleşince keşfedilmesi uzun zaman aldı, çünkü çoğu zaman bilim insanlarının bir gezegen bulmayı beklediği yerde değildi.\n\nUzayın kötü şöhretli köşelerinde sıkça dolaşma huyu yüzünden, bu cüce gezegen bilim camiası tarafından resmen "Güvenilmez" olarak damgalandı.
		#autoLOC_900100 = Gözlerinizi iyice kısarsanız görebileceğiniz kırmızı nokta olarak da bilinen Duna, uzun zamandır Kerbal türü için bir merak konusu olmuştur. Bu gezegen, çarpıcı kırmızı rengi ve yeşil renkle olan keskin zıtlığı sayesinde büyük bir hayranlıkla anılmıştır.
		#autoLOC_900101 = Eşsiz bir dünya olan Kerbin'de düz ovalar, yükselen dağlar ve geniş, mavi okyanuslar bulunur. Kerbalların yuvası olan bu gezegen, o hevesli yeşil yaratıklardan oluşan geniş ve tükenmek bilmeyen bir nüfusu desteklemek için tam da gereken koşullara sahiptir.\n\nKerbin çevresinde kararlı bir yörüngeye ulaşmak, filizlenen uzay programlarının uğraştığı ilk şeylerden biridir. Gemisini yörüngeye sokabilenlerin her yere giden yolun yarısını kat ettiği söylenir.
		#autoLOC_900103 = Eve, güneş sistemindeki kesinlikle en mor cisimdir. Büyük ölçüde çok, çok mor rengi sayesinde, en büyük ve en belirgin görülebilen cisimlerden biridir.\n\nBazılarına göre Kerbin'in neredeyse kardeş gezegeni sayılır. Tabii mor rengine, zehirli atmosferine ve aşırı basınç ile sıcaklıklarına rağmen. Aslında hiç de benzemiyor, değil mi? Kim bu insanlar acaba?
		#autoLOC_900105 = Moho, Kerbal mitolojisinde akan lav okyanuslarıyla dolu ateşli bir yer olarak geçer. Gerçekte ise çok daha az ilginçtir. \n\nBilim insanları onu "hikayelerdeki gibi müthiş" hale getirmenin olası yollarını tartışıyor. Bu fikirlerden bazıları havacılık ve uzay teknolojisinde yeni atılımlara yol açtı.
