		#autoLOC_316191 = Neredeyse geldik. Aracı mavi manevra işaretiyle hizalamak için elle döndürülebilir, ya da bunu otomatik yapması için S.A.S. <color=<<1>>>Manevra</color> modu kullanılabilir (bu, aracı düğümün yakma vektörüyle hizalar).\n \nManevraya kalan süre, tahmini yakma süresinin yaklaşık yarısına indiğinde yakma yapılarak düğüm uygulanır. (Önceki bir eğitimde konuştuğumuz gibi, bu, yakmayı daha verimli ve hassas kılar.) \n \nHer şey ters giderse, periapsisin apoapsisten en fazla 5km daha alçak olmasını sağlamak için prograde yönünde yak\u2014 şu anki amacımız için dairesel bir yörüngeye yeterince yakın olur.
