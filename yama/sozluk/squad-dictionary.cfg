		#autoLOC_6012030 = Kerbal Space Program 1.7: Manevra için Yer Var sürümüne hoş geldiniz! \n\nİsminin de ima ettiği gibi bu sürüm güncellemesi, roketleri uzayda yönlendirmeye yardımcı olacak yeni özellikler ve iyileştirmelerle dolu. \n\nİki yeni navigasyon aracı yükseltmesi var. Uçuş ekranının üst kısmında, irtifa ölçerin yanında gizemli yeni bir simge dikkat çekiyor. İrtifa ölçere tıklandığında gösterge deniz seviyesi okumasından yer üstü okumasına geçiyor; böylece Jeb artık gemiyi yalnızca göstergelere bakarak indirebilecek. Üstelik bu sefer gerçekten tek parça halinde kalmasını sağlayarak. \n\nUçuş ekranının sol alt köşesinde, diğer tüm mod geçişlerinin yanında yeni bir simge var. Ona tıklandığında 'Manevra Modu' eklendiği görülüyor. Bu mod, hem Harita hem de Uçuş modunda apoapsis, periapsis, dışmerkezlik gibi yörünge bilgilerine erişim sağlayan tek bir panelle açılıyor. Daha da iyisi, bir manevra düğümü yerleştirildiğinde, gezegenler arası geçişleri ince ayarlamaya yardımcı olacak, o manevrayı ayarlamaya yarayan ikinci bir panel de beliriyor. \n\nGörsel olarak, tüm küçük manevra motorlarını güncelledik - Ant, Twitch, Puff, Place-Anywhere 7, RV-105 İtici Bloğu ve Vernor Motoru'nun hepsi gelişmiş bir görsel işlemden geçti; Twitch, Ant ve Spider'ın ise yeni varyantları var. Gezegenler arasında süzülürken keyifle izlenebilecek, yükseltilmiş bir galaksi haritası da eklendi.\n\nSon bir dokunuş olarak, parça eylem pencereleri çok büyüdüğünde kaydırma çubukları eklendi - özellikle bu pencereleri dolduran modlar varsa oldukça işe yarıyor - ve bazı küçük manevra motorlarına yeni ayar değerleri getirildi. Ayrıca Making History sahipleri için yeni bir 3,75 metrelik burun konisi ve bir de 5 metrelik olanı var! \n\n1.7 Manevra için Yer Var sürümünün keyfini çıkarmanızı umuyoruz!
