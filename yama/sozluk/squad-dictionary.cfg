		#autoLOC_6011123 = Kerbal Space Program 1.8: Dahaaa Fazla Güçlendirici sürümüne hoş geldiniz!\n\nYeni parçalar, güncellemeler ve iyileştirmelerle dolup taşan en son sürüm güncellememizi sunmaktan büyük heyecan duyuyoruz!\n\nİlk olarak, Unity'yi 2019.2.2f1 sürümüne yükselttik. Bu motor yükseltmesi görsellere, gölgelendiricilere ve VFX'e iyileştirmeler getiriyor. Artımlı çöp toplamadan (garbage collection) faydalanılıyor - özellikle mod topluluğu için büyük bir kazanç, çünkü modlu kurulumlardaki kare hızı takılmaları çoğunlukla GC'den kaynaklanıyordu. Unity yükseltmesiyle birlikte birçok performans iyileştirmesine de odaklanıldı! Örneğin, roket "kazara" bir şeye çarptığında kare hızı dramatik biçimde iyileşti, yani çöküş acısı artık daha kısa ve daha tatlı sürüyor.\n\nGörsel iyileştirmeler yalnızca motor güncellemesiyle sınırlı değil - yeni parça ve gezegen yenilemeleri de var. Mun, Minmus, Duna, Ike, Eve ve Gilly, özellikle yakından bakıldığında çok daha iyi görünüyor; 3,75 metrelik tanklarımız da öyle!\n\nSırada, uçuş sırasında kullanılabilen bir aksiyon/eksen grubu düzenleyicisi eklendi! Aksiyon grupları uygulamasına gidip yeni düğme bulunabilir - artık araç kontrolleri fırlatıldıktan sonra da değiştirilebiliyor, bu da 1.7'den beri eklenen tüm ekstra aksiyon grubu işlevlerinin kullanımında daha fazla esneklik sağlıyor.\n\nBu güncellemeye adını veren şey, beş yeni katı yakıtlı roket eklenmesi! Dördü standart oyun için, biri Making History için. Katı yakıtlı motorlarımız artık tek bir çapla sınırlı değil; seçim yapmak için .625m, 1,25m, 2,5m ve - DLC ile birlikte - 1,875m güçlendiriciler mevcut. Making History ayrıca güçlendiriciyi tamamlayacak 1,875 metrelik bir burun konisi de kazandı. Breaking Ground da yeni parçalar kazanıyor: Uzay keşfeden dronlar yapmayı daha eğlenceli hale getiren üç yeni kanallı fan kanadı ve bunlara eşlik eden kanallı fan kılıf parçaları.\n\nEn son KSP sürümü diğer iyileştirmelerle o kadar dolu ki, hepsini burada anlatmak mümkün değil; dah