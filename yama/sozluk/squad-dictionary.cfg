		#autoLOC_317803 = Tamam, artık apoapsis düğümüne doğru ilerleniyor. Yükselirken aracın hız kaybettiği fark ediliyor mu? Bunun nedeni gezegenden uzaklaşarak tırmanılması; tıpkı Kerbin'de havaya atılan bir topun yükseldikçe yavaşlaması gibi, yükseldikçe hız kaybedilir. \n\nNe kadar yükseklerdeyse, yörünge de o kadar yavaş olur. Mun'un yörünge hızının yaklaşık 540m/s olduğu (Mun'un işaretinin üzerine gelinerek görülebilir), buna karşın buradaki hızın çok daha yüksek olduğu fark ediliyor mu? Bunun nedeni, bu yörüngenin Mun'unkinden çok daha alçak olmasıdır. \n\nApoapsise ulaşıldığında, periapsis düğümünü yükseltip yörüngeyi daireselleştirmek için yeniden prograde yönünde yakma yapılacak.
