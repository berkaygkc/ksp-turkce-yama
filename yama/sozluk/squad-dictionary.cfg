		#autoLOC_8003447 = Kerbal Space Program 1.11'de yenilikler: Biraz Yeniden Montaj Gerektirir\n\nKerbal Space Program'ın bir başka sürümünü sunmanın heyecanını yaşıyoruz. Bu sefer her şey yeni EVA etkinlikleri eklemekle ilgili!\n\nİlk olarak, EVA yapım modu eklendi. Kerbal mühendisler artık dışarı çıkıp yeni lazer kaynak makineleriyle bir araç üzerinde değişiklik yapabiliyor. Her parçanın ağırlığına bağlı olarak parçaları taşıyabiliyor, çıkarabiliyor ve araçlarına ekleyebiliyorlar - düşük yerçekiminde çalışmak gittikçe daha büyük yapılar inşa etmeyi mümkün kılıyor! EVA yapım modu, tam bir yerleştirme/taşıma/döndürme araç seti ve her zaman yardımcı olan Merkez göstergeleriyle (CoM, CoL ve CoT) birlikte geliyor.\n\nEVA yapımını desteklemek için Breaking Ground genişlemesindeki Kargo Sistemini ana oyuna taşıdık ve ona birkaç şey daha ekledik. Artık favori parçaların çoğu kargo olarak taşınabiliyor. Ancak bunların artık hacim sınırları var, bu yüzden her şeyi (mutfak lavabosu dahil) araca sığdırmak mümkün olmayabilir. Ama bu konuda da birkaç yeni kargo konteyneri ve bazı mevcut parçalara eklenen depolama alanlarıyla önlem aldık.\n\nEnvanterlerden bahsetmişken, Kerbal paraşütleri ve jetpack'ler artık çıkarılabiliyor ve Kerbal'ın kendi envanterinde taşınıyor; böylece bunlar başka faydalı eşyalarla değiştirilebiliyor ya da kütleden tasarruf etmek için tamamen çıkarılabiliyor. Bir Kerbal'ın kütlesi artık taşıdığı eşyalardan etkileniyor ve bu da aracı etkiliyor. Mürettebat kabinleri buna göre değiştirildi, ancak artık kısmi mürettebatla fırlatmak fark yaratacak.\n\nParça onarımları artık ana oyunun bir parçası. Güneş panelleri veya anten gibi geçmişte kalıcı olarak hasar gören parçalar, artık bir veya daha fazla onarım kiti kullanan bir EVA Kerbal'ı tarafından onarılabiliyor. Bu ve yukarıdaki her yeni özellik için yeni kontratlar eklendi.\n\nSırada, yukarıda bahsedilen kargo konteynerlerinin yanı sıra oyuna bir dizi yeni parça daha eklendi! Aracı veya açık hava çalışma alanını aydınlatmaya yardımcı olacak, hem takılabilir hem de açılıp kapanabilir çeşitli yeni ışıklar ve yeni ışık işlevleri var. Yeni, daha küçük RCS ve RCS blok varyant yapılandırmalarımız var. Kerballerin EVA dayanıklılığını uzatmak için yedek bir EVA yakıt silindiri bulunuyor. Ayrıca dışarıdayken bazı deneyler denemek isteyen bir Kerbal için yeni bir EVA bilim kiti var.\n\nSon olarak, Güneş Sistemi yenilemesini tamamlamaya çok yaklaştık - bu sefer sırada Tylo, Bop ve Val'ın yenilenmesi var.\n\nHer zaman olduğu gibi, değişiklik günlüğünde incelenebilecek pek çok ayrıntı var. Kerbal Space Program 1.11: Biraz Yeniden Montaj Gerektirir sürümünün beğenilmesini umuyoruz.
