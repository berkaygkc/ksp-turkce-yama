		#autoLOC_8003234 = Kerbal Space Program: Breaking Ground Genişlemesi, eleştirmenlerce beğenilen uzay uçuşu simülatörü Kerbal Space Program'ın PC sürümüne yapılan ikinci ektir.\n\nÖzellik dolu bu genişleme, gök cisimlerine ulaşıldıktan sonra daha ilginç bilimsel olanaklar ekleyerek ve araç setini genişleterek seçenekleri artırmaya odaklanıyor.\n\n Bir gök cismine iniş yapıldıktan sonra, bilimsel deneyler yürütmek için artık çeşitli veri toplama ekipmanları konuşlandırılabiliyor. Bu veriler toplanırken, güneş sistemine yeni eklenen yüzey özellikleri dağıtıldı; oyuncuların bunları taramak ya da daha ayrıntılı inceleme için Kerbin'e geri getirmek üzere arayıp bulması gerekecek. \n\n Ayrıca robotik parçalar da ekleniyor! Çeşitli boyutlarda bir menteşe, piston, rotor ve döner servo, oyuncuların araçlarının olanaklarını büyük ölçüde değiştirmek için kullanılabilecek. Bunların tümü gerçek kuvvetler ve tork, elektrik tüketimi, hatta motor kütlesiyle gerçekçi fizik kuralları altında çalışıyor.
