		#autoLOC_500000 = Neden yukarı çıkasın ki, yana doğru da aynı ustalıkla çakılabiliyorken? C7 Havacılık Bölümü'nün eski parolası buydu. Mütevazı başlangıçlardan bugünün güç merkezine uzanan yolda C7 hep ufka dimdik bakan bir firma oldu. Son zamanlarda ise gökle yerin buluştuğu o noktayı çok daha iyi görmelerini sağlayacak parçalar üretiyorlar. Bu durum şirketteki eski kuşaktan biraz homurdanmaya yol açtı, ama onlar bile hangi yöne gidersen git bir macera bulunabileceğini inkâr edemiyor.
		#autoLOC_500001 = Dinkelstein Kerman, uzay aracı sektöründe adeta bir efsane hâline geldi; özellikle de kayıtlara geçen ilk uzay aracından çok daha önce gemi inşa edip uçurduğunu ısrarla iddia etmesiyle. Bu durum, kendisiyle Kerbin Dünya-İlkleri Kayıt Derneği arasında hatırı sayılır bir tartışma ve bolca gerginliğe yol açtı. Ne olursa olsun, Dinkelstein's Emporium hâlâ geleneksel, eski usul bir şirket olarak iyi bir üne sahip ve ürünleri, şirketin sahibinden gerçekten çok daha az paslı.
		#autoLOC_500002 = Experimental Engineering Group, tipik bir girişim şirketi: düşük bütçeler ve imkânsız derecede sıkı teslim tarihleri onlar için sıradan bir iş günü demek. Bu kadar genç bir şirket olmasına rağmen Experimental Engineering iyi bir başlangıç yaptı ve özellikle çok eğitici ve eğlenceli SC-9001 Science Jr. Deney Kiti sayesinde sektörde hızla ad yaptı. Temsilcilerinin cansiperane çabalarına rağmen, Ar-Ge'deki bir bilim insanının evcil hayvan olarak beslediği küçük bir yaratıkla ünitelerinden birinin karıştığı bir olaya ait sızdırılmış görüntülerin ardından yapışan kötü şöhreti bir türlü üzerlerinden atamadılar. Bazıları bu olayın onları ürünlerinin güvenliği konusunda aşırı titiz yaptığını söylüyor. Hatta şirket logolarının köşelerini bile yuvarlattılar.
		#autoLOC_500003 = FLOOYD Labs tek bir işe odaklanan bir şirket ve bu işi olabilecek en iyi şekilde yapıyor: sıvıları bir yerden başka bir yere taşımak. Amiral gemisi ürünleri FTX-2 Yakıt Kanalı, yıllar süren araştırma-geliştirme çalışmalarının ve sayısız Kerbal-saatlik emeğin ürünü; ne kadar soğuk, yoğun ya da uçucu olursa olsun hemen hemen her şeyi istenen miktarda pompalayabilen bir cihaz. Şirket, sektöre yaptığı bu önemli katkı sayesinde hak ettiği bir üne sahip ve bugünlerde neredeyse kimsenin, sıvıları kusursuzca pompalamasına rağmen bunu yanlış yöne pompalamak gibi küçük ama son derece sorunlu bir kusuru olan FTX-1 serisinin geri çağrılmasının utancını hatırlamadığı konusunda hemfikir.
		#autoLOC_500004 = Goliath National Products, rekabette önde kalmak için nelere ihtiyaç olduğunu biliyor: göz alıcı bir ayrıntı hassasiyeti ve cesur mühendislerimizin neye ihtiyacı olduğunu koklayarak bulabilen iyi bir burun. Çağımızın büyük araçlarının çoğu Goliath'ın burun konilerinden birini taşıyor ve bu koniler, herhangi bir aracın yumuşak, etten kemikten ve önemli parçalarının önünden -yani bir sonraki maceraya atılan kahramanlarımızın önünden- havayı çekip almakta ustalar.
		#autoLOC_500005 = Bu küçük şirketin deneyim ve itibar konusunda eksik kaldığı yeri, projelerinin cüretkârlığıyla kapatıyor. İlk ürünleri, oldukça devasa Mobil İşlem Laboratuvarı'ydı; söylentiye göre bu tesis aslında deneysel, belki de yasa dışı bir yakıt karışımını gizlice üretmek için tasarlanmış mobil bir işlem tesisiydi ve bu karışımın mevcut yakıtlardan çok daha güçlü olduğu, ayrıca kendine özgü mavi bir renge sahip olduğu söyleniyordu. Ancak bu söylentiler hiçbir zaman kanıtlanmadı ve bu gizemli mavi yakıt henüz güvenilir bir kaynak tarafından görülmüş değil. Şirketin bu söylentilerden kurtulma yönündeki tekrarlanan çabalarına rağmen, (muhtemelen hak etmedikleri) kötü bir üne sahip olmaya devam ediyorlar. Bu ilk izlenimi dengelemek için benzer büyüklükteki diğer şirketlerden çok daha yüksek nakit ödemeleri sunmaya çalışıyorlar, ki bunun mevcut imajlarını iyileştirmeye pek bir katkısı olduğu söylenemez.
		#autoLOC_500006 = Uzay aracı elektroniğinde önde gelen isimlerden biri, hem de sadece adı bu kadar havalı diye değil. Ionic Symphonic Protonic Electronics, basit haberleşme cihazlarından son derece gelişmiş donanımlara kadar geniş bir ürün kataloğuna sahip. Bu da ürünlerini havacılık-uzay mühendisleri arasında oldukça popüler yaptı, bir yandan da Probodobodyne'deki pragmatik ekiple aralarında derin bir husumet doğmasına neden oldu.
		#autoLOC_500007 = Jeb's Junkyard'ın, aşılmaz görünen zorluklar karşısında sarsılmaz azmin en güzel örneklerinden biri olduğu herkesçe kabul edilir. Kerbal ırkının uzayın derinliklerine attığı ilk adımların bir kısmının burada atıldığı söylenen bu mütevazı hurdalık, uzay aracı parçalarına giderek artan talebi karşılayabilmek için tesislerini genişletmek zorunda kalarak çok daha büyük bir hurdalığa dönüştü. Jeb's Junkyard, Kerbin'in en simgesel isimlerinden biri hâline geldi ve sevilen bir markadan çok daha fazlası oldu. Artık, işin ciddiyetini fena hâlde küçümseyerek imkânsızı denemekten vazgeçmeyen o durdurulamaz Kerbal ruhunun bir simgesi olarak gururla duruyor.
		#autoLOC_500008 = Kerbal Motion LLC, tekerlek işine başlarken önce kare tekerleklerle başladı. Ardından daha küresel bir tasarıma ulaşana kadar yavaş yavaş kenar eklemeye devam ettiler. Yoğun testler, yuvarlak tekerleklerin gerçekten çok daha rahat bir sürüş sağladığı şüphesini doğruladı. Bu engeli aştıktan sonra Kerbal Motion LLC'nin dahi kadrosu, o kayda değer beyin güçlerini başka nerede kullanabileceklerine bakmaya başladı. Sonunda kavrama kollarına karar verdiler; büyük ölçüde de içeceklerine ulaşmak için bu kadar uzanmak zorunda kalmayacak olmalarından ötürü.
		#autoLOC_500009 = Her türlü olayın ilk gerçekleşmesini titizlikle takip edip belgelemeye adanmış bir kurum olan Kerbin Dünya-İlkleri Kayıt Derneği, daha önce hiç yapılmamış -özellikle uzay keşfiyle ilgili- başarıları ödüllendirmek amacıyla kurulmuş kâr amacı gütmeyen bir kuruluştur. Ancak işleri göründüğünden daha zordur, çünkü herhangi bir başarının ilk kez gerçekleştirilmesiyle gelen prestij, ticari şirketler için de değerli bir hedeftir ve bu şirketler böyle bir olayın resmi sponsoru olma fırsatını asla kaçırmaz. Derneğin kontratlarını üstlenmek, işin para için olmadığınızı açıkça gösterir; bu da her zaman verilmeye değer bir mesajdır. Ayrıca neredeyse tek ödül de budur, çünkü nakit ödüller çoğunlukla sembolik niteliktedir.
		#autoLOC_500010 = Kerbodyne, havacılık-uzay sektöründe nispeten yeni bir isim olsa da K serisi motorları ve yakıt tankları kısa sürede kendilerine hatırı sayılır bir ün kazandırdı. O kadar ki Kerbodyne, geçen yılki Uzay Aracı Geliştiricileri Kongresi'nde "En İyi Debüt" ödülüne aday gösterildi. Ne yazık ki ödül başka bir şirkete gitti, ama Kerbodyne hayranlarının şirkete ve ürünlerine olan takdirlerini yüksek sesle ve alenen dile getirdikleri biliniyor.
		#autoLOC_500011 = Kerlington'ın çığır açan yeni teknolojiler sunma konusunda uzun bir geçmişi var; bunların birçoğu artık roketbilim ve havacılık-uzay mühendisliği için vazgeçilmez kabul ediliyor. Bu durum, sadık Kerlington hayranlarından oluşan güçlü bir topluluğun yanı sıra, bir o kadar büyük ve keyifsiz bir rakip grubunun da doğmasına yol açtı.
		#autoLOC_500012 = Maxo Construction Toys'un mühendisleri her zaman bir şeyler inşa etmekten hoşlanmıştır -özellikle de küçük plastik tuğlalardan. Kafa kafaya verip banka hesaplarında biraz para biriktirdiklerinde, aynı şeyi bu sefer hafif metal parçalarla yapmaya karar verdiler. Maxo'nun metal yapıları dayanıklılığı ve işçilik kalitesiyle tanınır. Nitekim bir başka görkemli "iniş"in enkazı didik didik edildiğinde, onların parçaları neredeyse her zaman sapasağlam bulunur.
		#autoLOC_500013 = Moving Parts Experts Group, uzay aracı yapımı için gerçekten yenilikçi ve çığır açan teknolojiler geliştirmek amacıyla parlak zihinleri bir araya getiren, büyük ölçüde ticari olmayan bir girişim olarak yola çıktı. Bu tür birçok girişimde olduğu gibi, başlangıç yatırım fonları çok kısa sürede tükendi ve hızla satabilecekleri şeyler geliştirmek zorunda kaldılar. Bunun sonucunda Grup, her zaman acele içinde ve her zaman para sıkıntısı çeken bir şirket olarak ün kazandı. Yine de asıl amaçlarına olabildiğince sadık kalmaya çalışıyorlar ve mevcut sınırları zorlayan her girişimi desteklemeye her zaman hazırlar.
		#autoLOC_500014 = Mümkün olduğunca çok yıkım yaratarak ün kazanmış bir şirket olarak O.M.B., son derece uçucu cihazları için havacılık-uzay sektöründe kayda değer derecede uygun bir yer bulmuş durumda. Hassas Ayırıcıları, bir uzay aracını birden fazla küçük parçaya bölmek gerektiğinde rakipsizdir. Ancak çok daha güçlü sökme araçları olarak şiddetle reklamı yapılan diğer bazı yıkım ürünleri, aynı ölçüde başarılı olamadı. O.M.B., o "açıkça daha iyi" ürünlerin neden bu kadar rağbet görmediğinden hâlâ emin değil.
		#autoLOC_500015 = Periapsis Rocket Supplies, gizliliğiyle nam salmış bir şirket -ürettikleri az sayıdaki parça bile etraflarındaki gizemi artırmaktan başka bir işe yaramıyor. Birçok kişi neden daha fazla parça üretmediklerini merak ediyor, ama Periapsis buna "bakalım bundan sonra ne yapacağız!" diyerek cevap veriyor. Ancak bu, en az 3 nesildir standart cevapları olduğu için birçok kişi bu cevabı biraz uzun süredir bekliyor.
		#autoLOC_500016 = Probodobodyne, bir zamanlar sektördeki önde gelen (ve az sayıdaki) isimlerden biriydi. Yıllar içinde şirket biraz geride kalmış olsa da, uzay keşfinin, bunun zorluklarını asgari teknolojik destekle aşabilenlerin ayrıcalığı olması gerektiği felsefesini sürdürmeye devam ediyor. Ürünleri, çevrelerinde uzay yolculuğunu "eski günlere" kıyasla çok daha erişilebilir kılan pek çok yeni şirket ortaya çıkmasına rağmen, bu pragmatik ve tartışmalı biçimde eski moda bakış açısını yansıtıyor. Tüm bunlara rağmen şirket, yalnızca en iyi astronotların ve mühendislerin bulunduğu, son derece seçkin bir sektör vizyonuyla yaşayan küçük ama sadık bir hayran kitlesini korumayı başardı.
		#autoLOC_500017 = Uzay Programı'nın kendi Araştırma ve Geliştirme Departmanı. Ünlü roket bilimci Wernher von Kerman'ın başında bulunduğu bu ekip, tüm operasyonun beynidir. Dinmek bilmeyen bir bilgi susuzluğuyla hareket ederler; hiçbir veri parçası ne çok küçüktür ne de çok önemsizdir, Kerbal ırkının birikmiş bilgisini artırmak onların temel motivasyonudur. Ekibimizin dâhileri, bilime katkıları için yalnızca hak ettikleri akademik itibarı istiyor; ayrıca tüm astronotlardan laboratuvarlara girmeden önce lütfen çizmelerini temizlemelerini rica ediyorlar.
		#autoLOC_500018 = Reaction Systems, tek başarılı ürünleri olan Her Yere Monte Edilebilir Doğrusal RCS Portu ile makul ölçüde başarı yakalamış küçük bir şirket. Bugünlerde şu anda üzerinde ne çalıştıklarını kimse tam olarak bilmiyor. Reaction Systems kesinlikle en büyük şirket olmasa da, bunu tüm öncü girişimleri destekleyerek telafi etmeye çalışıyor. Ayrıca bilim toplama kontratları sunma konusundaki isteklilikleri, bir şeylerin peşinde olabilecekleri yönündeki spekülasyonlara güç katıyor.
		#autoLOC_500019 = Tartışmasız en büyük roketçilik bileşenleri tedarikçisi olan Rockomax'ın ürünleri, uzaya açılmanın en erişilebilir yolu olarak geniş çapta kabul görüyor. Bu durum, daha zarif ya da avangart mühendisler arasında biraz olumsuz bir üne yol açtı; hatta bazıları Rockomax Marka ürün kullandıklarını kabul etmeyi bile reddediyor. Ne olursa olsun, Rockomax'ın sektördeki devasa varlığı yadsınamaz ve daha üst sınıf roketçilik markalarının o 'trend' havasından yoksun olsalar da ürünleri gerçekten oldukça iyi bir fiyat-performans sunuyor. Kendileri son derece büyük bir şirket, bu yüzden size çok özel anlaşmalar yapmalarını beklemeyin. Zaten tüm müşterilerine toplu alım indirimi ve ortak markalarının ürünlerini kullandıklarında 'süper avantajlı' fırsatlar sunuyorlar. Tabii tüm bunlar, depolarından alışveriş yaparken üyelik kartınızı yanınızda getirmeniz koşuluyla geçerli.
		#autoLOC_500020 = Rokea, çoğunlukla basit 'merdivenlerle' karıştırılmaması için epey uğraştıkları 'dikey hareketlilik artırıcı' ürünleriyle tanınır. Bazıları bu konuda fena hâlde başarısız olduklarını söylese de, her Rokea temsilcisi kulak mesafesindeki herkese merdivenler ile dikey hareketlilik artırma cihazı arasındaki farkları büyük bir istekle anlatmaya devam ediyor. Belki de kimsenin umursamamasının bir nedeni de bu iletişim stratejisidir.
		#autoLOC_500021 = Birçok kişi, son derece kaliteli konserve gıda ürünleriyle tanınan Sean's Cannery'nin havacılık-uzay mühendisliği dünyasına adım atmasının arkasındaki mantığı sorguluyor. Eleştirilere rağmen, amiral gemisi ürünleri Mk2 İniş Kapsülü'nün defalarca kez güvenilir olduğunu kanıtladığını -ve belki de şaşırtıcı olmayan bir şekilde- bugün mevcut en hava geçirmez mürettebat taşıma modüllerinden biri olduğunu kimse inkâr edemez. İniş Kapsülü mürettebatları, modülün depolanan atıştırmalıkları taze ve çıtır tutma becerisini sık sık övüyor ve diğer kapsüllerde bunların görev başladıktan sadece birkaç gün sonra yumuşayıp lapa gibi olmasından şikayet ediyor.
